name: PVE candidate reusable build

on:
  workflow_call:
    inputs:
      variant:
        type: string
        required: true
      windows_iso_url:
        type: string
        required: true
      image_index:
        type: string
        required: true
      disk_size_gb:
        type: string
        required: true
      skip_cleanup:
        type: boolean
        default: false
      enable_dotnet35:
        type: boolean
        default: false
      preserve_winre:
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 480
    permissions:
      contents: read
    env:
      POWERSHELL_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned build tools
        shell: pwsh
        run: |
          $deps = Get-Content .\config\pve-dependencies.json -Raw | ConvertFrom-Json
          choco install aria2 -y --no-progress
          choco install qemu --version $deps.qemu.chocolatey_version -y --no-progress
          $qemuImg = Get-ChildItem 'C:\Program Files\qemu' -Filter qemu-img.exe -Recurse | Select-Object -First 1
          if (-not $qemuImg) { throw 'Pinned qemu-img.exe was not installed.' }
          "QEMU_IMG=$($qemuImg.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Download source and pinned guest dependencies
        shell: pwsh
        run: |
          $deps = Get-Content .\config\pve-dependencies.json -Raw | ConvertFrom-Json
          aria2c --max-connection-per-server=16 --split=16 --continue=true --allow-overwrite=true --auto-file-renaming=false --out=windows.iso '${{ inputs.windows_iso_url }}'
          curl.exe --fail --location --retry 3 --retry-all-errors --output virtio-win.iso $deps.virtio.url
          if ($LASTEXITCODE -ne 0) { throw 'VirtIO ISO download failed.' }
          curl.exe --fail --location --retry 3 --retry-all-errors --output CloudbaseInitSetup.msi $deps.cloudbase_init.url
          if ($LASTEXITCODE -ne 0) { throw 'Cloudbase-Init download failed.' }
          foreach ($item in @(
            @{ Path = '.\virtio-win.iso'; Dependency = $deps.virtio },
            @{ Path = '.\CloudbaseInitSetup.msi'; Dependency = $deps.cloudbase_init }
          )) {
            $actualHash = (Get-FileHash $item.Path -Algorithm $item.Dependency.hash_algorithm).Hash
            if ($actualHash -ine $item.Dependency.hash) {
              throw "Dependency checksum mismatch for $($item.Path). Expected $($item.Dependency.hash), got $actualHash."
            }
          }

      - name: Mount Windows source
        shell: pwsh
        run: |
          $image = Mount-DiskImage -ImagePath (Resolve-Path .\windows.iso) -PassThru
          $drive = ($image | Get-Volume).DriveLetter
          if (-not $drive) { throw 'Windows ISO mount has no drive letter.' }
          "WINDOWS_ISO_DRIVE=$drive" | Out-File $env:GITHUB_ENV -Append

      - name: Build candidate QCOW2
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          $scripts = @{
            standard = '.\scripts\tiny11maker-headless.ps1'
            core = '.\scripts\tiny11coremaker-headless.ps1'
            nano = '.\scripts\nano11builder-headless.ps1'
          }
          $params = @{
            ISO = $env:WINDOWS_ISO_DRIVE
            INDEX = [int]'${{ inputs.image_index }}'
            DiskSizeGB = [int]'${{ inputs.disk_size_gb }}'
            VirtioISOPath = (Resolve-Path .\virtio-win.iso).Path
            CloudbaseInitMSIPath = (Resolve-Path .\CloudbaseInitSetup.msi).Path
            QemuImgPath = $env:QEMU_IMG
          }
          if ('${{ inputs.skip_cleanup }}' -eq 'true') { $params.SkipCleanup = $true }
          if ('${{ inputs.enable_dotnet35 }}' -eq 'true' -and '${{ inputs.variant }}' -eq 'core') { $params.ENABLE_DOTNET35 = $true }
          if ('${{ inputs.preserve_winre }}' -eq 'true' -and '${{ inputs.variant }}' -ne 'standard') { $params.PreserveWinRE = $true }
          & $scripts['${{ inputs.variant }}'] @params
          if ($LASTEXITCODE -ne 0) { throw "Builder exited with code $LASTEXITCODE" }

      - name: Verify static candidate metadata
        shell: pwsh
        run: |
          $candidate = Get-ChildItem .\scripts\*-candidate.qcow2 -File
          if ($candidate.Count -ne 1) { throw "Expected exactly one candidate QCOW2, found $($candidate.Count)." }
          $manifest = Get-Content "$($candidate.FullName).manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.target -ne 'Proxmox VE 8.4/9.x' -or $manifest.validation_level -ne 'static-only') { throw 'Candidate manifest target/validation level is invalid.' }
          if ($manifest.runtime_validated -ne $false -or $manifest.hardware_validated -ne $false) { throw 'Candidate must not claim runtime or hardware validation.' }

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiny11-${{ inputs.variant }}-pve-candidate
          path: |
            scripts/*-candidate.qcow2
            scripts/*-candidate.qcow2.sha256
            scripts/*-candidate.qcow2.manifest.json
          retention-days: 7
          if-no-files-found: error

      - name: Collect failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\diagnostics -Force | Out-Null
          Get-ChildItem .\scripts -Filter '*.log' -ErrorAction SilentlyContinue |
            Copy-Item -Destination .\diagnostics -Force
          if (Test-Path 'C:\Windows\Logs\DISM\dism.log') {
            Copy-Item 'C:\Windows\Logs\DISM\dism.log' .\diagnostics\dism.log -Force
          }
          Get-FileHash .\virtio-win.iso -Algorithm SHA512 -ErrorAction SilentlyContinue |
            Format-List | Out-File .\diagnostics\dependency-hashes.txt
          Get-FileHash .\CloudbaseInitSetup.msi -Algorithm SHA256 -ErrorAction SilentlyContinue |
            Format-List | Out-File .\diagnostics\dependency-hashes.txt -Append
          Get-ChildItem .\scripts -Force | Select-Object Name, Length, LastWriteTime |
            Format-Table -AutoSize | Out-File .\diagnostics\scripts-files.txt

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tiny11-${{ inputs.variant }}-failure-diagnostics
          path: diagnostics/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload retained intermediate WIM
        if: failure() && inputs.skip_cleanup
        uses: actions/upload-artifact@v4
        with:
          name: tiny11-${{ inputs.variant }}-intermediate-wim
          path: |
            scripts/tiny11/sources/install.wim
            scripts/nano11/sources/install.wim
          retention-days: 3
          compression-level: 0
          if-no-files-found: warn

      - name: Dismount Windows source
        if: always()
        shell: pwsh
        run: |
          $iso = Join-Path $PWD 'windows.iso'
          if (Test-Path $iso) { Dismount-DiskImage -ImagePath $iso -ErrorAction SilentlyContinue }
