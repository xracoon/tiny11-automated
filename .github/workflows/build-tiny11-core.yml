name: Build Tiny11 Core PVE Candidate

on:
  workflow_dispatch:
    inputs:
      windows_iso_url:
        description: Official Windows 11 x64 ISO URL
        required: true
      image_index:
        description: Windows image index
        required: true
        default: '6'
        type: choice
        options: ['1', '4', '6', '7']
      disk_size_gb:
        description: Virtual disk size in GiB
        required: true
        default: '32'
      skip_cleanup:
        description: Keep intermediate files for diagnosis
        type: boolean
        default: false
      enable_dotnet35:
        description: Enable .NET Framework 3.5
        type: boolean
        default: false
      preserve_winre:
        description: Preserve WinRE
        type: boolean
        default: false

jobs:
  build:
    uses: ./.github/workflows/pve-candidate-reusable.yml
    with:
      variant: core
      windows_iso_url: ${{ inputs.windows_iso_url }}
      image_index: ${{ inputs.image_index }}
      disk_size_gb: ${{ inputs.disk_size_gb }}
      skip_cleanup: ${{ inputs.skip_cleanup }}
      enable_dotnet35: ${{ inputs.enable_dotnet35 }}
      preserve_winre: ${{ inputs.preserve_winre }}
