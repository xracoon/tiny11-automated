name: 构建 Nano11 简体中文 PVE 候选镜像

on:
  workflow_dispatch:
    inputs:
      windows_iso_url:
        description: 官方 Windows 11 x64 简体中文（zh-CN）ISO 下载地址
        required: true
      image_index:
        description: Windows 映像索引
        required: true
        default: '6'
        type: choice
        options: ['1', '4', '6', '7']
      disk_size_gb:
        description: 虚拟磁盘容量（GiB）
        required: true
        default: '32'
      skip_cleanup:
        description: 失败时保留并上传裁剪后的 install.wim（占用较多存储）
        type: boolean
        default: false
      preserve_winre:
        description: 保留 Windows 恢复环境
        type: boolean
        default: true

jobs:
  build-nano-zh-cn:
    name: Nano11 zh-CN PVE candidate
    runs-on: windows-latest
    timeout-minutes: 480
    permissions:
      contents: read
    env:
      POWERSHELL_TELEMETRY_OPTOUT: '1'
      SOURCE_ISO_URL: ${{ inputs.windows_iso_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装固定版本构建工具
        shell: pwsh
        run: |
          $deps = Get-Content .\config\pve-dependencies.json -Raw | ConvertFrom-Json
          choco install aria2 -y --no-progress
          choco install qemu --version $deps.qemu.chocolatey_version -y --no-progress
          $qemuImg = Get-ChildItem 'C:\Program Files\qemu' -Filter qemu-img.exe -Recurse | Select-Object -First 1
          if (-not $qemuImg) { throw '固定版本 qemu-img.exe 安装失败。' }
          "QEMU_IMG=$($qemuImg.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: 下载 Windows ISO 和固定版本依赖
        shell: pwsh
        run: |
          $deps = Get-Content .\config\pve-dependencies.json -Raw | ConvertFrom-Json
          aria2c --max-connection-per-server=16 --split=16 --continue=true --allow-overwrite=true --auto-file-renaming=false --out=windows-zh-cn.iso $env:SOURCE_ISO_URL
          curl.exe --fail --location --retry 3 --retry-all-errors --output virtio-win.iso $deps.virtio.url
          if ($LASTEXITCODE -ne 0) { throw 'VirtIO ISO 下载失败。' }
          curl.exe --fail --location --retry 3 --retry-all-errors --output CloudbaseInitSetup.msi $deps.cloudbase_init.url
          if ($LASTEXITCODE -ne 0) { throw 'Cloudbase-Init 下载失败。' }
          foreach ($item in @(
            @{ Path = '.\virtio-win.iso'; Dependency = $deps.virtio },
            @{ Path = '.\CloudbaseInitSetup.msi'; Dependency = $deps.cloudbase_init }
          )) {
            $actualHash = (Get-FileHash $item.Path -Algorithm $item.Dependency.hash_algorithm).Hash
            if ($actualHash -ine $item.Dependency.hash) {
              throw "依赖校验失败：$($item.Path)，期望 $($item.Dependency.hash)，实际 $actualHash。"
            }
          }

      - name: 挂载 Windows 简体中文源镜像
        shell: pwsh
        run: |
          $image = Mount-DiskImage -ImagePath (Resolve-Path .\windows-zh-cn.iso) -PassThru
          $drive = ($image | Get-Volume).DriveLetter
          if (-not $drive) { throw 'Windows ISO 挂载后没有获得驱动器号。' }
          "WINDOWS_ISO_DRIVE=$drive" | Out-File $env:GITHUB_ENV -Append

      - name: 构建 Nano11 简体中文 QCOW2 候选镜像
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          $params = @{
            ISO = $env:WINDOWS_ISO_DRIVE
            INDEX = [int]'${{ inputs.image_index }}'
            DiskSizeGB = [int]'${{ inputs.disk_size_gb }}'
            VirtioISOPath = (Resolve-Path .\virtio-win.iso).Path
            CloudbaseInitMSIPath = (Resolve-Path .\CloudbaseInitSetup.msi).Path
            QemuImgPath = $env:QEMU_IMG
          }
          if ('${{ inputs.skip_cleanup }}' -eq 'true') { $params.SkipCleanup = $true }
          if ('${{ inputs.preserve_winre }}' -eq 'true') { $params.PreserveWinRE = $true }
          .\scripts\nano11builder-headless.ps1 @params
          if ($LASTEXITCODE -ne 0) { throw "Nano11 构建器退出码为 $LASTEXITCODE。" }

      - name: 验证候选镜像静态元数据
        shell: pwsh
        run: |
          $candidate = Get-Item .\scripts\nano11-zh-cn-pve-candidate.qcow2
          $manifest = Get-Content "$($candidate.FullName).manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.target -ne 'Proxmox VE 8.4/9.x' -or $manifest.validation_level -ne 'static-only') { throw '候选镜像目标或验证等级错误。' }
          if ($manifest.runtime_validated -ne $false -or $manifest.hardware_validated -ne $false) { throw '候选镜像不得声明已完成运行时或硬件验证。' }
          if ($manifest.language -ne 'zh-CN') { throw '候选镜像清单未声明 zh-CN。' }
          $expected = @('ui', 'microsoft-pinyin', 'basic-fonts', 'basic-language-features')
          foreach ($feature in $expected) {
            if ($feature -notin $manifest.chinese_support) { throw "候选镜像缺少中文能力声明：$feature" }
          }

      - name: 上传 Nano11 简体中文候选产物
        uses: actions/upload-artifact@v4
        with:
          name: nano11-zh-cn-pve-candidate
          path: |
            scripts/nano11-zh-cn-pve-candidate.qcow2
            scripts/nano11-zh-cn-pve-candidate.qcow2.sha256
            scripts/nano11-zh-cn-pve-candidate.qcow2.manifest.json
          retention-days: 7
          if-no-files-found: error

      - name: 收集失败诊断信息
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\diagnostics -Force | Out-Null
          Get-ChildItem .\scripts -Filter 'nano11_*.log' -ErrorAction SilentlyContinue |
            Copy-Item -Destination .\diagnostics -Force
          if (Test-Path 'C:\Windows\Logs\DISM\dism.log') {
            Copy-Item 'C:\Windows\Logs\DISM\dism.log' .\diagnostics\dism.log -Force
          }
          Get-FileHash .\virtio-win.iso -Algorithm SHA512 -ErrorAction SilentlyContinue |
            Format-List | Out-File .\diagnostics\dependency-hashes.txt
          Get-FileHash .\CloudbaseInitSetup.msi -Algorithm SHA256 -ErrorAction SilentlyContinue |
            Format-List | Out-File .\diagnostics\dependency-hashes.txt -Append
          Get-ChildItem .\scripts -Force | Select-Object Name, Length, LastWriteTime |
            Format-Table -AutoSize | Out-File .\diagnostics\scripts-files.txt

      - name: 上传失败诊断包
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nano11-zh-cn-failure-diagnostics
          path: diagnostics/
          retention-days: 7
          if-no-files-found: warn

      - name: 上传保留的中间 WIM
        if: failure() && inputs.skip_cleanup
        uses: actions/upload-artifact@v4
        with:
          name: nano11-zh-cn-intermediate-wim
          path: scripts/nano11/sources/install.wim
          retention-days: 3
          compression-level: 0
          if-no-files-found: warn

      - name: 卸载 Windows 源镜像
        if: always()
        shell: pwsh
        run: |
          $iso = Join-Path $PWD 'windows-zh-cn.iso'
          if (Test-Path $iso) { Dismount-DiskImage -ImagePath $iso -ErrorAction SilentlyContinue }
